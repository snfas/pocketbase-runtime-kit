name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/pocketbase-app

      - name: Render chart
        run: helm template pocketbase-test charts/pocketbase-app

  docker:
    name: Runtime image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: runtime
          push: false
          build-args: |
            KIT_VERSION=0.1.0
            PB_VERSION=0.22.6
          tags: pocketbase-runtime-kit:test
