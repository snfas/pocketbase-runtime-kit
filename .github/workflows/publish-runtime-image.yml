name: Publish Runtime Image and Helm Chart

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      pocketbase_version:
        description: PocketBase binary version to embed
        required: true
        default: "0.22.6"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PB_VERSION: ${{ inputs.pocketbase_version || '0.22.6' }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: runtime
          push: true
          build-args: |
            KIT_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            PB_VERSION=${{ env.PB_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-chart:
    name: Publish Helm chart
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Check chart version matches release tag
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          chart_version="$(awk '$1 == "version:" { print $2; exit }' charts/pocketbase-app/Chart.yaml)"
          if [ "$chart_version" != "$release_version" ]; then
            echo "Chart version ($chart_version) must match release tag ($release_version)."
            exit 1
          fi

      - name: Package Helm chart
        run: helm package charts/pocketbase-app --destination "$RUNNER_TEMP"

      - name: Log in to GHCR
        env:
          HELM_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$HELM_REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push Helm chart
        run: helm push "$RUNNER_TEMP/pocketbase-app-${GITHUB_REF_NAME#v}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
